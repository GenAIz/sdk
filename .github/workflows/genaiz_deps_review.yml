name: genaiz_deps_review.yml
on:
  pull_request:
    branches:
      - master
    paths:
      - 'genaiz/**'

jobs:
  genaiz_deps_review:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure
          show-patched-versions: true
