include:
  - ../services/mock-broker-compose.yaml
  - ../services/mock-registry-compose.yaml

services:
  genaiz-mock-publish-simple-create:
    container_name: genaiz_mock_publish_simple_create
    image: genaiz.com/sdk/genaiz:latest
    command: >
      sf create --recipe=bash-example 
        --configType=yaml
        --fqdn=dev.genaiz.com 
        --handle=mock-publish-simple
        --oem=com.genaiz
        --name="Mock Publish Simple"
        --arch=x86_64
        --type=function
        --logLevel=debug
      mock-publish-simple
    volumes:
      - ${TESTS_MOUNT:-.}:/home/genaiz/
    profiles:
      - mock-publish-simple

  genaiz-mock-publish-simple-provision:
    depends_on:
      registry:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    container_name: genaiz_mock_publish_simple_provision
    user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
    image: genaiz.com/sdk/genaiz-it:latest
    command: wiremock function provision mock_publish_simple_function_provision_ok mock_publish_simple_get_id_2 --image genaiz.com/mock-publish-simple --registry=registry:5000 --wiremock=wiremock:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - mock-publish-simple

  genaiz-mock-publish-simple-login:
    depends_on:
      wiremock:
        condition: service_healthy
    container_name: genaiz_mock_publish_simple_login
    image: genaiz.com/sdk/genaiz:latest
    user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
    command: ac login wiremock:8080 --username _test@genaiz.com --logLevel=debug
    environment:
      - GENAIZ_PASSWORD=success
    volumes:
      - ${TESTS_MOUNT:-.}/.cache/genaiz:/home/genaiz/.cache/genaiz
    profiles:
      - mock-publish-simple

  genaiz-mock-publish-simple:
    depends_on:
      genaiz-mock-publish-simple-create:
        condition: service_completed_successfully
      genaiz-mock-publish-simple-login:
        condition: service_completed_successfully
      genaiz-mock-publish-simple-provision:
        condition: service_completed_successfully
    container_name: genaiz_mock_publish_simple
    image: genaiz.com/sdk/genaiz:latest
    user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
    command: sf publish wiremock:8080 --rebuild --version=0.1 --logLevel=debug
    working_dir: /home/genaiz/mock-publish-simple
    volumes:
      - ${TESTS_MOUNT:-.}:/home/genaiz/
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - mock-publish-simple

  genaiz-mock-publish-simple-verify:
    depends_on:
      genaiz-mock-publish-simple:
        condition: service_completed_successfully
    container_name: genaiz_mock_publish_simple_verify
    image: genaiz.com/sdk/genaiz-it:latest
    command: wiremock mapping mock_publish_simple_function_provision_ok
    profiles:
      - mock-publish-simple

  genaiz-mock-publish-simple-cleanup:
    depends_on:
      genaiz-mock-publish-simple-verify:
        condition: service_completed_successfully
    container_name: genaiz_mock_publish_simple_cleanup
    image: genaiz.com/sdk/genaiz-it:latest
    command: wiremock mapping reset
    profiles:
      - mock-publish-simple-cleanup
